<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Saturn's rings and moons at true scale, moving in real time — fly from the whole system into a 10-meter-thick ring layer." />
  <title>Saturn — Rings in Real Time</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='15' ry='4.6' fill='none' stroke='%23f1cd8c' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23e9d3a6'/%3E%3Cpath d='M1.4 16.6c1 2.2 7 3.9 14.6 3.9s13.6-1.7 14.6-3.9' fill='none' stroke='%23f1cd8c' stroke-width='2'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #loading {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 60%, #0b0d12 0%, #020203 70%); transition: opacity 0.9s ease; color: #ece8df;
      font: 12px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .mark { width: 150px; height: 90px; margin-bottom: 22px; }
    #loading h1 { margin: 0; font-weight: 300; font-size: 30px; line-height: 1.1; letter-spacing: 0.42em; text-indent: 0.42em; }
    #loading .tag { margin-top: 12px; color: rgba(236, 232, 223, 0.58); font-size: 12.5px; letter-spacing: 0.02em; text-align: center; max-width: 520px; padding: 0 20px; }
    #loading .bar { width: 220px; height: 2px; background: rgba(255, 255, 255, 0.08); border-radius: 2px; margin-top: 28px; overflow: hidden; }
    #loading .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #8f7a55, #f1cd8c); transition: width 0.4s ease; }
    #loading .status { margin-top: 10px; color: rgba(236, 232, 223, 0.36); font-size: 11px; min-height: 15px; letter-spacing: 0.03em; }
    #loading .err { margin-top: 14px; color: #ffb070; max-width: 560px; text-align: center; padding: 0 20px; white-space: pre-wrap; }
    @keyframes sv-spin { to { transform: rotate(360deg); } }
    #loading .mark .orbit { transform-origin: 75px 45px; animation: sv-spin 18s linear infinite; }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <svg class="mark" viewBox="0 0 150 90" aria-hidden="true">
      <defs>
        <linearGradient id="svg-planet" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f3dcae" /><stop offset="1" stop-color="#6d5a3d" />
        </linearGradient>
        <clipPath id="svg-front"><rect x="0" y="45" width="150" height="45" /></clipPath>
      </defs>
      <ellipse cx="75" cy="45" rx="70" ry="13" fill="none" stroke="rgba(241,205,140,0.35)" stroke-width="1" />
      <ellipse cx="75" cy="45" rx="58" ry="10.5" fill="none" stroke="rgba(241,205,140,0.55)" stroke-width="4" />
      <circle cx="75" cy="45" r="26" fill="url(#svg-planet)" />
      <g clip-path="url(#svg-front)">
        <ellipse cx="75" cy="45" rx="58" ry="10.5" fill="none" stroke="rgba(241,205,140,0.75)" stroke-width="4" />
        <ellipse cx="75" cy="45" rx="70" ry="13" fill="none" stroke="rgba(241,205,140,0.45)" stroke-width="1" />
      </g>
      <g class="orbit"><circle cx="146" cy="45" r="1.6" fill="#ece8df" /></g>
    </svg>
    <h1>SATURN</h1>
    <div class="tag">The rings and moons at true scale, moving in real time — from millions of kilometers out to inside a 10-meter-thick layer of ice.</div>
    <div class="bar"><i></i></div>
    <div class="status">Loading…</div>
    <noscript><div class="err">This simulator needs JavaScript and WebGL2.</div></noscript>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
