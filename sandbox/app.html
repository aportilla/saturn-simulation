<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saturn — app sandbox (stub passes)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='15' ry='4.6' fill='none' stroke='%23f1cd8c' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23e9d3a6'/%3E%3C/svg%3E" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #loading { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #020203; color: #ece8df; font: 12px/1.45 ui-sans-serif, -apple-system, sans-serif; transition: opacity 0.6s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading h1 { margin: 0; font-weight: 300; font-size: 22px; letter-spacing: 0.3em; }
    #loading .tag { margin-top: 8px; color: rgba(236, 232, 223, 0.5); }
    #loading .bar { width: 200px; height: 2px; background: rgba(255,255,255,0.08); margin-top: 20px; }
    #loading .bar i { display: block; height: 100%; width: 0; background: #f1cd8c; transition: width 0.3s; }
    #loading .status { margin-top: 8px; color: rgba(236, 232, 223, 0.36); font-size: 11px; }
    #loading .err { margin-top: 12px; color: #ffb070; white-space: pre-wrap; text-align: center; }
  </style>
</head>
<body>
  <div id="loading"><h1>SATURN</h1><div class="tag">app sandbox — stub render passes</div><div class="bar"><i></i></div><div class="status">Loading…</div></div>
  <script type="module" src="./app.ts"></script>
</body>
</html>
